# Submits the Gradle dependency graph, so GitHub can alert on a vulnerable JVM dependency.
#
# Without this the graph holds only what GitHub can parse from a manifest on its own, which here is the npm
# tree and the workflow actions: the Kotlin backend is absent entirely, so no Dependabot alert can ever fire
# for it. Dependabot's VERSION updates are unaffected either way, since those read libs.versions.toml
# directly; what is missing without a graph is security alerting, in particular for a transitive dependency
# that no version bump happens to move.
#
# GitHub's own "Automatic Dependency Submission" cannot do this here: it probes `./gradlew help` and then
# `gradle help`, and this project has no wrapper by design (mise provisions Gradle) and no Gradle on a bare
# runner's PATH. Its failure output says to check in a workflow instead, which is this file.
name: Dependency submission

on:
  # main only. A snapshot describes the dependencies of a ref, so submitting from pull request branches
  # would write throwaway states into the graph that alerts are then raised against.
  push:
    branches: [ "main" ]
  workflow_dispatch: {} # allow manual runs

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      # Wider than the scanners need, and unavoidable: submitting a snapshot is a write to the repository's
      # dependency graph. Nothing else in this job writes anything.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # the snapshot is posted with the job token, not with git credentials

      # Supplies the Java toolchain the build resolves against. Gradle itself comes from the action below,
      # which insists on either a wrapper or an explicit version, so mise's copy goes unused here.
      - uses: jdx/mise-action@v4

      # Ask the Gradle mise just installed what it actually is, rather than reading mise.toml. The pin there
      # is a prefix ("9.5"), which mise resolves to the newest matching release, but the action below needs
      # an exact one and rejects a prefix with "Gradle version 9.5 does not exist". This keeps mise the
      # single source of truth while always yielding a real release.
      - name: Resolve the exact Gradle version
        id: gradle
        run: echo "version=$(gradle --version | awk '/^Gradle /{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Resolve and submit the dependency graph
        uses: gradle/actions/dependency-submission@v4
        with:
          # Given a version, the action downloads that Gradle and uses it, which is what lets a project
          # without a wrapper use this action at all.
          gradle-version: ${{ steps.gradle.outputs.version }}
