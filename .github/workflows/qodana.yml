# Qodana: JetBrains' code-quality scanner, run as a SEPARATE job from build.yml. It runs the IntelliJ
# inspection engine headlessly so CI catches the idiomatic issues that the fast gates do not.
#
# One job, `qodana`, scanning the Kotlin/JVM backend (the JVM Community linter; the linter, profile, JDK,
# and enforcement settings live in the root qodana.yaml). It catches what ktlint/detekt do not: a redundant
# SAM constructor, a lambda that belongs outside the parentheses, a redundant `public` modifier, unused
# symbols, and the rest of the IDE's default Kotlin checks. It uses the `recommended` profile (mirrors the
# IDE's default inspection profile) and failThreshold: 0.
#
# There is deliberately no Angular/SPA counterpart here. Qodana analyzes JavaScript and TypeScript only
# through the qodana-js linter, which JetBrains licenses under Ultimate; no Community linter covers JS/TS,
# so on this project's Community license the frontend scan could not run at all (it failed at the license
# check before inspecting a file). The SPA's static analysis is the angular-eslint + typescript-eslint +
# Stylelint + Knip gate that `npm run lint` runs, wired into `gradle check` by the frontendLint task.
name: Qodana

on:
  # One scan per change, not two. This used to run on every branch push AND on pull requests, so a PR
  # branch was scanned twice, and the two scans did not agree: the action's `pr-mode` defaults to true and
  # analyzes ONLY the files a pull request touches, while a push scan covers the whole project. With
  # failThreshold: 0 that asymmetry is a trap. A change that newly surfaces pre-existing problems (a linter
  # bump is the usual way) fails the push scan while the pull-request scan passes, so the PR shows a green
  # `qodana` beside a red one and reading the aggregate as green merges a red main. That happened when the
  # linter moved to 2026.2.
  #
  # So: pull requests are the gate (with pr-mode disabled below, so they scan everything a push would), and
  # push covers main directly for anything landed outside a PR. A branch with no pull request open is no
  # longer scanned, which is the deliberate trade for halving the scan count; open the PR to get it.
  # The pull-request trigger is deliberately NOT filtered by base branch. Filtering it to `main` silently
  # skips a pull request stacked on another branch: no job runs, and the pull request reports "no checks"
  # rather than a failure, which reads as fine. Every pull request is gated, whatever it targets.
  pull_request:
  push:
    branches: [ "main" ]
  workflow_dispatch: {} # allow manual runs

permissions:
  contents: read

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post the inspection summary as a PR comment (when triggered by a PR)
      checks: write        # publish findings as check-run annotations (used on push, where there is no PR)
      actions: read        # let the action read this workflow run for its status report (telemetry)
    steps:
      - uses: actions/checkout@v7
        with:
          # Qodana diffs the change against the base ref to label problems as new vs. pre-existing, so it
          # needs full history, mirroring build.yml.
          fetch-depth: 0
          persist-credentials: false # no step pushes back to the repository

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.2.0
        with:
          # Scan the whole project on a pull request too, not just its changed files (the action's default).
          # A diff-only scan cannot see a problem this change surfaces elsewhere, so with failThreshold: 0 it
          # would pass a PR that turns main red. See the trigger comment at the top.
          pr-mode: false
        # qodana.yaml sets `failThreshold: 0`, so this job fails on any problem above the baseline. Once
        # qodana.sarif.baseline is committed (see qodana.yaml), add to the `with:` above to count only NEW
        # problems:
        #   args: --baseline,qodana.sarif.baseline
        #
        # Intentionally no QODANA_TOKEN here: the free qodana-jvm-community linter runs without a Qodana Cloud
        # connection, so this job needs no token, and the SARIF and the failThreshold gate work fully without
        # one. (To put the backend in Cloud too, create a jvm project and pass its token; a Cloud project
        # supports only one linter, so it must be its own project.)

      # No code-scanning upload: this is a private repo without GitHub Advanced Security, so
      # github/codeql-action/upload-sarif cannot push to the Security tab (it 403s with "Resource not
      # accessible by integration"). Qodana surfaces findings as check-run annotations (the checks: write
      # permission) and the full report is kept as the artifact below. If GHAS is enabled later, re-add that
      # step with `security-events: write`, and use codeql-action@v4 (v3 is deprecated and runs on Node 20).

      - name: Upload Qodana SARIF as an artifact
        # Keeps the full SARIF report downloadable from the run for inspection (and to seed a baseline later
        # if you choose to grandfather findings instead of excluding an inspection; see qodana.yaml).
        # `if: always()` so a run that fails the threshold still yields the file.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qodana-sarif
          path: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          if-no-files-found: warn
