# CodeQL: GitHub's own semantic code scanner, run as a SEPARATE workflow from build.yml for the same reason
# Qodana and Semgrep are. It is the deepest of the three: it compiles the code into a queryable database and
# follows data across files and calls, so it catches a tainted value reaching a sink several hops from where
# it entered, which the linters (one file at a time) and Semgrep (syntactic patterns) cannot see.
#
# Free here because the repository is public. It was not an option while the repository was private, since
# code scanning on a private repository needs GitHub Advanced Security; the note in qodana.yml about SARIF
# uploads being rejected dates from then.
#
# The two languages need different build modes. TypeScript analyzes from source (`none`), so that half needs
# no npm install. Kotlin does not: CodeQL builds its database from compiled output, and `none` fails outright
# with "detected code written in Java/Kotlin but could not process any of it". Nor does autobuild work here,
# because it looks for ./gradlew and this project has no wrapper (mise provisions Gradle). So the JVM half
# uses `manual`: mise supplies the toolchain and one `gradle classes` compiles every module for CodeQL to
# read. Tests are not compiled, since only main sources are analyzed.
name: CodeQL

on:
  # Matches the other scanners: every pull request is the gate, whatever branch it targets, and push covers
  # main for anything landed outside one. The weekly run exists because CodeQL's queries are updated
  # independently of this repository, so a new query can find something in code that has not changed.
  pull_request:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 4 * * 1' # 04:00 UTC every Monday
  workflow_dispatch: {} # allow manual runs

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # publish the findings to the repository's Security tab
      actions: read
    strategy:
      fail-fast: false # one language's failure should not hide the other's findings
      matrix:
        include:
          - language: java-kotlin # the Gradle modules: domain, api, data, application
            build-mode: manual
          - language: javascript-typescript # the Angular SPA and the Playwright suite
            build-mode: none

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # no step pushes back to the repository

      # Only the manual (JVM) build needs a toolchain; the TypeScript half analyzes from source.
      - uses: jdx/mise-action@v4
        if: matrix.build-mode == 'manual'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # `classes` compiles the main sources of every module (kapt included, so the generated MapStruct
      # mappers are analyzed too) without building the SPA, running tests, or producing a jar.
      - name: Compile for CodeQL
        if: matrix.build-mode == 'manual'
        run: gradle classes

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
